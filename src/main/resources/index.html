<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #6d28d9);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 27px;
            margin-bottom: 9px;
        }

        .header p {
            font-size: 14px;
            color: #e5e7eb;
        }

        .form-section {
            padding: 30px;
        }

        .form-section h2 {
            font-size: 21px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #f9fafb;
            color: #6b7280;
            font-size: 12px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 500px) {
            .form-section {
                padding: 22px;
            }

            .header h1 {
                font-size: 23px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Student Registration</h1>

            <p>Welcome! Register yourself to get started.</p>

        </div>

        <div class="form-section">

            <h2>Create Your Account</h2>

            <p class="description">
                Please fill in your details to complete registration.
            </p>

            <form action="/register" method="POST">

                <div class="form-group">

                    <label for="studentName">Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="rollNumber">Roll Number</label>

                    <input
                        type="text"
                        id="rollNumber"
                        name="rollNumber"
                        placeholder="Enter your roll number"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="course">Course</label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="e.g. B.Tech CSE"
                        required
                    >

                </div>

                <button type="submit" class="submit-btn">
                    Submit Registration
                </button>

            </form>

        </div>

        <div class="footer">

            Student Registration Portal | DevOps Practical

        </div>

    </div>

</body>

</html>
